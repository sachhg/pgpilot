apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpilot
  namespace: pgpilot
  labels:
    app.kubernetes.io/name: pgpilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pgpilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgpilot
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pgpilot
          image: pgpilot:0.1.0
          args: ["-config", "/etc/pgpilot/pgpilot.json", "-log-level", "info"]
          ports:
            - name: postgres
              containerPort: 6432
            - name: metrics
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/pgpilot
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: pgpilot-config
