# pgpilot's configuration carries user passwords inline, so the whole config
# file lives in a Secret (not a ConfigMap) and is mounted read-only as the
# config path. Replace CHANGE_ME and the backend addresses before applying, and
# manage this file with your secret tooling (sealed-secrets, SOPS, ...) rather
# than committing real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: pgpilot-config
  namespace: pgpilot
  labels:
    app.kubernetes.io/name: pgpilot
type: Opaque
stringData:
  pgpilot.json: |
    {
      "listen": "0.0.0.0:6432",
      "primary": "postgres-primary.database.svc.cluster.local:5432",
      "replicas": [
        "postgres-replica-0.database.svc.cluster.local:5432",
        "postgres-replica-1.database.svc.cluster.local:5432"
      ],
      "users": [{"name": "pgpilot", "password": "CHANGE_ME"}],
      "pool": {"mode": "transaction", "max_size": 20, "acquire_timeout": "5s", "idle_timeout": "5m"},
      "health": {"interval": "2s", "failure_threshold": 3, "base_backoff": "1s", "max_backoff": "30s"},
      "fencing": {"mode": "strict", "bounded_ms": 100},
      "routing": {"policy": "least-in-flight"},
      "observability": {"metrics_addr": "0.0.0.0:9090"}
    }
